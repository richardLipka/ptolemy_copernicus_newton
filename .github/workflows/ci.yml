name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite is mostly orbital mathematics checked against published
      # values, including the claim that Ptolemy's model predicts the superior
      # planets better than Copernicus's. If that ever stops holding, the
      # demonstration this project exists for has broken.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
