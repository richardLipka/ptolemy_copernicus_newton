name: CI

on:
  push:
    # The experiment branch too, so pushing it actually runs the suite. Its
    # Pages workflow builds but does not test, and a branch nobody checks is a
    # branch that quietly rots.
    branches: [main, experimental/recentred-harness]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite is mostly orbital mathematics checked against published
      # values, including the claim that heliocentrism on its own bought almost
      # no accuracy — Copernicus's construction sits in the same bracket as
      # Ptolemy's, and it took Kepler's ellipse to break the deadlock. If that
      # ever stops holding, the demonstration this project exists for has broken.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
