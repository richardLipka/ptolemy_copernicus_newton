# Publishes the built app to GitHub Pages.
#
# Pages is enabled for this repository with "GitHub Actions" as the source, so
# no manual step is needed. `configure-pages` carries `enablement: true` as a
# belt-and-braces measure for a fork or a fresh clone, where it would otherwise
# fail on a repository that has never had Pages turned on.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The app is a workspace, so the build lands in the app's own directory
      # rather than at the repository root. This path moved with the split to
      # npm workspaces and the deploy uploaded nothing until it was corrected.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/orrery/dist

      - id: deployment
        uses: actions/deploy-pages@v4
